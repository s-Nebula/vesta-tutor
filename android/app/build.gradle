plugins {
    id "com.android.application"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode") ?: "1"
def flutterVersionName = localProperties.getProperty("flutter.versionName") ?: "1.0"

def keystoreProperties = new Properties()
// La clave de firma y sus contraseñas viven fuera del proyecto
// (vesta-build/secrets/signing) para que nunca acaben en el repositorio.
// Se puede indicar otra ruta con la variable VESTA_KEY_PROPERTIES.
def keystorePropertiesFile = file(
    System.getenv("VESTA_KEY_PROPERTIES") ?:
        "${rootProject.projectDir}/../../../secrets/signing/key.properties"
)
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "org.vestaopensource.tutor"
    compileSdk = 36 
    ndkVersion = "28.2.13676358"

    compileOptions {
        coreLibraryDesugaringEnabled = true
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    kotlinOptions {
        jvmTarget = "21"
    }

    defaultConfig {
        applicationId = "org.vestaopensource.tutor"
        minSdkVersion = flutter.minSdkVersion
        targetSdk = 36 
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
        multiDexEnabled = true
    }

    signingConfigs {
        release {
            if (keystoreProperties.containsKey("storeFile")) {
                storeFile file(keystoreProperties["storeFile"])
                storePassword keystoreProperties["storePassword"]
                keyAlias keystoreProperties["keyAlias"]
                keyPassword keystoreProperties["keyPassword"]
            }
            // v1 (JAR) signing as well as v2: Huawei's installer (EMUI/HarmonyOS)
            // rejects v2-only APKs with "did not find any certificates".
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }
    buildTypes {
        release {
            // CORRECCIÓN: Nunca uses debug en release. 
            // Si no tienes una keystore, déjalo vacío o usa proguardFiles
            signingConfig = signingConfigs.release 
            minifyEnabled false
            shrinkResources false
        }
    }

    // AÑADIDO: Previene errores de duplicación de archivos en librerías nativas
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"
}
